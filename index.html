<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NutriVision & Fitness Coach</title>

<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#10161A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NutriVision" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="icon" href="/icon-192.png" />

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; background: #10161A; }
  body { font-family: 'Inter', sans-serif; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #28333A; border-radius: 4px; }
  .spin { animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #8FBF6B; outline-offset: 1px; }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<div id="root">
  <div id="nv-boot-status" style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; box-sizing:border-box; font-family: 'Inter', sans-serif; color:#EDEFEF; text-align:center;">
    <div style="width:26px; height:26px; border:2.5px solid #8FBF6B55; border-top-color:#8FBF6B; border-radius:50%; animation: spin 1s linear infinite;"></div>
    <div style="font-size:13px; color:#8B9AA1;">Caricamento dell'app…</div>
  </div>
</div>

<script>
  // Diagnostica di avvio: se qualcosa non si carica (es. React da CDN bloccato),
  // mostra un messaggio leggibile invece di lasciare lo schermo vuoto.
  window.__nvErrors = [];
  window.addEventListener("error", function (e) {
    var msg = e && e.message ? e.message : (e && e.target && e.target.src ? "Impossibile caricare: " + e.target.src : "Errore sconosciuto");
    window.__nvErrors.push(msg);
  }, true);

  window.addEventListener("load", function () {
    setTimeout(function () {
      var stillBooting = document.getElementById("nv-boot-status");
      if (!stillBooting) return; // l'app React ha già preso il controllo, tutto ok
      var missing = [];
      if (typeof React === "undefined") missing.push("React (unpkg.com/react)");
      if (typeof ReactDOM === "undefined") missing.push("ReactDOM (unpkg.com/react-dom)");
      if (typeof Babel === "undefined") missing.push("Babel (unpkg.com/@babel/standalone)");
      var details = "";
      if (missing.length) {
        details += "<div style='margin-bottom:10px;'>Librerie non caricate:<br/><b>" + missing.join("<br/>") + "</b></div>";
      }
      if (window.__nvErrors.length) {
        details += "<div style='text-align:left; max-width:520px; background:#182126; border:1px solid #28333A; border-radius:10px; padding:12px; font-family: monospace; font-size:11px; color:#E2725B; white-space:pre-wrap;'>" + window.__nvErrors.slice(0, 6).join("\n\n") + "</div>";
      }
      stillBooting.innerHTML =
        "<div style='font-size:15px; font-weight:600; color:#E2725B; margin-bottom:8px;'>⚠️ L'app non si è avviata</div>" +
        "<div style='font-size:12.5px; color:#8B9AA1; max-width:480px; margin-bottom:10px;'>Probabile causa: connessione che blocca script esterni (unpkg.com), o una rete/VPN/DNS che filtra i contenuti. Prova con il Wi-Fi invece dei dati mobili, o viceversa.</div>" +
        details +
        "<button onclick='location.reload()' style='margin-top:14px; background:#8FBF6B; color:#10160F; border:none; border-radius:10px; padding:10px 18px; font-weight:600; font-family:Inter,sans-serif; font-size:13px;'>Riprova</button>";
    }, 4000);
  });
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

// ---------------------------------------------------------------------------
// Design tokens
// ---------------------------------------------------------------------------
const COLORS = {
  bg: "#10161A", surface: "#182126", surface2: "#1E2A30", border: "#28333A",
  text: "#EDEFEF", muted: "#8B9AA1", green: "#8FBF6B", amber: "#E3A23D",
  coral: "#E2725B", blue: "#6FA8C3", purple: "#A88FD6",
};

// ---------------------------------------------------------------------------
// Storage (locale sul telefono/browser)
// ---------------------------------------------------------------------------
const STORE_KEY = "nv-app-data";
const emptyData = () => ({ goal: "", journal: [], weights: [], workouts: [], nutritionWeeklyAverages: [] });

function loadAppData() {
  try {
    const raw = window.localStorage.getItem(STORE_KEY);
    if (raw) return { ...emptyData(), ...JSON.parse(raw) };
  } catch (e) {}
  return emptyData();
}
function saveAppData(data) {
  try { window.localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
  catch (e) { console.error("Salvataggio non riuscito", e); }
}

// ---------------------------------------------------------------------------
// Claude API (via funzione serverless /api/claude — chiave mai nel browser)
// ---------------------------------------------------------------------------
async function callClaude({ system, content, maxTokens = 1200 }) {
  const res = await fetch("/api/claude", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ system, content, maxTokens }),
  });
  if (!res.ok) {
    const errBody = await res.json().catch(() => ({}));
    throw new Error(errBody.error || "Errore nella chiamata a Claude (" + res.status + ")");
  }
  const data = await res.json();
  const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
  if (!text) throw new Error("Risposta vuota da Claude.");
  return text;
}

function parseJsonLoose(text) {
  const cleaned = text.replace(/```json/gi, "").replace(/```/g, "").trim();
  try { return JSON.parse(cleaned); }
  catch (e) {
    const match = cleaned.match(/\{[\s\S]*\}/);
    if (match) { try { return JSON.parse(match[0]); } catch (e2) {} }
    return null;
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      resolve({ data: result.split(",")[1], mimeType: file.type || "image/jpeg", preview: result });
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function todayISO() { return new Date().toISOString().slice(0, 10); }
function daysAgoISO(n) { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); }

const BEER_PRESETS = [
  { label: "Piccola 0.3L", grams: 330, kcal: 140, protein: 1, carbs: 11, fat: 0 },
  { label: "Media 0.5L", grams: 500, kcal: 210, protein: 2, carbs: 17, fat: 0 },
  { label: "Pinta 0.568L", grams: 568, kcal: 240, protein: 2, carbs: 19, fat: 0 },
];

// ---------------------------------------------------------------------------
// System prompts
// ---------------------------------------------------------------------------
const SYS_FOOD_VISION = `Sei un nutrizionista esperto in analisi visiva degli alimenti. Analizza la foto di cibo o bevanda inviata e stima ingredienti, porzioni, calorie e macronutrienti.
Rispondi ESCLUSIVAMENTE con un oggetto JSON valido, senza testo extra e senza blocchi di codice, con questa struttura esatta:
{"items":[{"name":"string","grams":number,"kcal":number,"protein":number,"carbs":number,"fat":number}],"total":{"kcal":number,"protein":number,"carbs":number,"fat":number},"note":"un consiglio breve sull'equilibrio del pasto, una sola frase"}
Se l'immagine è ambigua, fai una stima ragionevole basata su porzioni standard e segnalalo nella nota.`;

const SYS_HEALTH_EXTRACT = `Analizzi screenshot di app di salute (Google Health, Fitbit, Samsung Health, Apple Salute, Health Connect). Estrai TUTTI i dati visibili nello screenshot.
Rispondi ESCLUSIVAMENTE con un oggetto JSON valido, senza testo extra, con questa struttura (usa null per i campi non visibili):
{"weight":number|null,"steps":number|null,"sleepHours":number|null,"caloriesBurned":number|null,"restingHeartRate":number|null,"hrv":number|null,"spo2":number|null,"respiratoryRate":number|null,"distanceKm":number|null,"activeMinutes":number|null,"summary":"breve riassunto in una frase"}`;

const SYS_WORKOUT_EXTRACT = `Analizzi screenshot di schede di allenamento, diari palestra o app fitness (Hevy, Strong, Garmin, Strava, quaderno). Estrai esercizi, serie, ripetizioni, carichi e note.
Rispondi ESCLUSIVAMENTE con un oggetto JSON valido, senza testo extra:
{"sessions":"string (es. 2 di 4)","notes":"dettaglio esercizi estratti in testo leggibile","summary":"breve frase riassuntiva"}`;

const SYS_WEEKLY_COACH = `Sei un Personal Trainer e Nutrition Coach di alto livello, specializzato in ricomposizione corporea e programmazione dell'allenamento.
Analizzi i dati del check-up settimanale dell'utente (obiettivo, andamento peso, alimentazione media, allenamento svolto questa settimana, storico degli allenamenti delle settimane precedenti, dati Google Health) per valutare i progressi e fornire un piano d'azione per la settimana successiva.
Usa lo storico degli allenamenti precedenti, quando disponibile, per valutare la progressione dei carichi/volumi nel tempo e dare consigli di progressione coerenti, non generici.
Rispondi ESCLUSIVAMENTE con un oggetto JSON valido, senza testo extra, con questa struttura:
{"valutazione":"analisi dell'andamento settimanale: aderenza ai macro, variazione di peso, recupero, passi","aggiustamenti_nutrizionali":"modifiche precise a calorie/proteine/carboidrati/grassi per la prossima settimana","aggiustamenti_allenamento":"consigli su progressione di carico, volume o recupero, confrontando con lo storico se disponibile","focus_settimana":"un singolo obiettivo chiave su cui concentrarsi"}
Tono: motivante, diretto, scientifico, basato sui dati forniti. Se una sezione di dati è vuota o mancante, notalo brevemente invece di inventare numeri.`;

// ---------------------------------------------------------------------------
// UI primitives (icone come emoji, niente librerie esterne)
// ---------------------------------------------------------------------------
function StatChip({ icon, label, value, color = COLORS.text }) {
  if (value === null || value === undefined || value === "") return null;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8, background: COLORS.surface2, border: `1px solid ${COLORS.border}`, borderRadius: 12, padding: "8px 12px" }}>
      <span style={{ fontSize: 15 }}>{icon}</span>
      <div>
        <div style={{ fontSize: 10, color: COLORS.muted }}>{label}</div>
        <div style={{ fontSize: 13, fontFamily: "JetBrains Mono", color: COLORS.text, fontWeight: 600 }}>{value}</div>
      </div>
    </div>
  );
}

function SectionCard({ number, title, icon, accent, children }) {
  return (
    <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 16, padding: 20, marginBottom: 16 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
        <div style={{ width: 26, height: 26, borderRadius: 8, background: accent + "22", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Space Grotesk", fontSize: 12, fontWeight: 700, color: accent, flexShrink: 0 }}>{number}</div>
        <span style={{ fontSize: 15 }}>{icon}</span>
        <h3 style={{ fontFamily: "Space Grotesk", fontSize: 14, fontWeight: 600, color: COLORS.text, margin: 0 }}>{title}</h3>
      </div>
      {children}
    </div>
  );
}

function Button({ children, onClick, disabled, variant = "primary", small, style }) {
  const base = { display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 7, fontFamily: "Inter", fontWeight: 600, fontSize: small ? 12 : 13, padding: small ? "7px 12px" : "11px 18px", borderRadius: 12, border: "none", cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.55 : 1, ...style };
  const variants = {
    primary: { background: COLORS.green, color: "#10160F" },
    secondary: { background: COLORS.surface2, color: COLORS.text, border: `1px solid ${COLORS.border}` },
    amber: { background: COLORS.amber, color: "#1A1206" },
    ghost: { background: "transparent", color: COLORS.muted, border: `1px solid ${COLORS.border}` },
  };
  return <button onClick={onClick} disabled={disabled} style={{ ...base, ...variants[variant] }}>{children}</button>;
}

function FieldInput({ label, value, onChange, placeholder, type = "text", suffix }) {
  return (
    <div style={{ flex: "1 1 90px" }}>
      <label style={{ fontFamily: "Inter", fontSize: 10.5, color: COLORS.muted, display: "block", marginBottom: 5 }}>{label}</label>
      <div style={{ position: "relative" }}>
        <input type={type} value={value} onChange={onChange} placeholder={placeholder}
          style={{ width: "100%", boxSizing: "border-box", background: COLORS.bg, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: suffix ? "9px 30px 9px 10px" : "9px 10px", color: COLORS.text, fontFamily: "JetBrains Mono", fontSize: 13 }} />
        {suffix && <span style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", fontSize: 11, color: COLORS.muted }}>{suffix}</span>}
      </div>
    </div>
  );
}

function Spinner({ color = COLORS.green, size = 20 }) {
  return <span className="spin" style={{ display: "inline-block", width: size, height: size, border: `2.5px solid ${color}55`, borderTopColor: color, borderRadius: "50%" }} />;
}

function MiniLineChart({ points }) {
  if (points.length < 2) return null;
  const W = 600, H = 160, PAD = 24;
  const values = points.map((p) => p.peso);
  const min = Math.min(...values) - 0.5, max = Math.max(...values) + 0.5;
  const xStep = (W - PAD * 2) / (points.length - 1);
  const yFor = (v) => H - PAD - ((v - min) / (max - min || 1)) * (H - PAD * 2);
  const path = points.map((p, i) => `${i === 0 ? "M" : "L"} ${PAD + i * xStep} ${yFor(p.peso)}`).join(" ");
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: 180 }} preserveAspectRatio="none">
      <path d={path} fill="none" stroke={COLORS.green} strokeWidth="2.5" />
      {points.map((p, i) => (
        <circle key={i} cx={PAD + i * xStep} cy={yFor(p.peso)} r="3" fill={COLORS.green} />
      ))}
      {points.map((p, i) => (
        i % Math.ceil(points.length / 6 || 1) === 0 && (
          <text key={"t" + i} x={PAD + i * xStep} y={H - 4} fontSize="9" fill={COLORS.muted} textAnchor="middle">{p.date}</text>
        )
      ))}
    </svg>
  );
}

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function sumJournalDay(entries) {
  return entries.reduce((acc, e) => ({
    kcal: acc.kcal + (Number(e.total?.kcal) || 0), protein: acc.protein + (Number(e.total?.protein) || 0),
    carbs: acc.carbs + (Number(e.total?.carbs) || 0), fat: acc.fat + (Number(e.total?.fat) || 0),
  }), { kcal: 0, protein: 0, carbs: 0, fat: 0 });
}

function computeWeeklyNutritionAvg(journal) {
  const cutoff = daysAgoISO(7);
  const recent = journal.filter((e) => e.date >= cutoff);
  if (recent.length === 0) return null;
  const byDay = {};
  recent.forEach((e) => {
    if (!byDay[e.date]) byDay[e.date] = { kcal: 0, protein: 0, carbs: 0, fat: 0 };
    byDay[e.date].kcal += Number(e.total?.kcal) || 0;
    byDay[e.date].protein += Number(e.total?.protein) || 0;
    byDay[e.date].carbs += Number(e.total?.carbs) || 0;
    byDay[e.date].fat += Number(e.total?.fat) || 0;
  });
  const days = Object.values(byDay); const n = days.length;
  return { days: n, kcal: Math.round(days.reduce((s, d) => s + d.kcal, 0) / n), protein: Math.round(days.reduce((s, d) => s + d.protein, 0) / n), carbs: Math.round(days.reduce((s, d) => s + d.carbs, 0) / n), fat: Math.round(days.reduce((s, d) => s + d.fat, 0) / n) };
}

function getEffectiveNutritionAvg(appData) {
  const live = computeWeeklyNutritionAvg(appData.journal);
  if (live) return { ...live, archived: false };
  const archived = appData.nutritionWeeklyAverages[0];
  if (archived) return { ...archived, archived: true };
  return null;
}

// ---------------------------------------------------------------------------
// TAB 1 — Analisi Cibo
// ---------------------------------------------------------------------------
const emptyManualEntry = () => ({ name: "", kcal: "", protein: "", carbs: "", fat: "" });

function FoodVisionTab({ appData, persist }) {
  const [preview, setPreview] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [result, setResult] = useState(null);
  const [saved, setSaved] = useState(false);
  const [beerMsg, setBeerMsg] = useState(null);
  const [manualOpen, setManualOpen] = useState(false);
  const [manualEntry, setManualEntry] = useState(emptyManualEntry());
  const [manualMsg, setManualMsg] = useState(null);
  const inputRef = useRef(null);
  const cameraInputRef = useRef(null);

  const todayEntries = appData.journal.filter((e) => e.date === todayISO());
  const todayTotals = sumJournalDay(todayEntries);

  const handleFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setError(null); setResult(null); setSaved(false); setLoading(true);
    try {
      const b64 = await fileToBase64(file);
      setPreview(b64.preview);
      const text = await callClaude({ system: SYS_FOOD_VISION, content: [{ type: "image", source: { type: "base64", media_type: b64.mimeType, data: b64.data } }, { type: "text", text: "Analizza questa immagine del piatto/bevanda." }] });
      const parsed = parseJsonLoose(text);
      if (!parsed) throw new Error("Non sono riuscito a interpretare la risposta dell'analisi.");
      setResult(parsed);
    } catch (err) { setError(err.message || "Errore durante l'analisi."); }
    finally { setLoading(false); if (inputRef.current) inputRef.current.value = ""; if (cameraInputRef.current) cameraInputRef.current.value = ""; }
  };

  const handleSaveToJournal = () => {
    if (!result) return;
    const entry = { id: "meal-" + Date.now(), date: todayISO(), time: new Date().toISOString().slice(11, 16), source: "foto", items: result.items || [], total: result.total || { kcal: 0, protein: 0, carbs: 0, fat: 0 }, note: result.note || "" };
    persist({ ...appData, journal: [entry, ...appData.journal] });
    setSaved(true);
  };

  const handleAddBeer = (preset) => {
    const entry = { id: "beer-" + Date.now(), date: todayISO(), time: new Date().toISOString().slice(11, 16), source: "birra", items: [{ name: "Birra — " + preset.label, grams: preset.grams, kcal: preset.kcal, protein: preset.protein, carbs: preset.carbs, fat: preset.fat }], total: { kcal: preset.kcal, protein: preset.protein, carbs: preset.carbs, fat: preset.fat }, note: "Registrata manualmente per tenerla sotto controllo." };
    persist({ ...appData, journal: [entry, ...appData.journal] });
    setBeerMsg(preset.label + " aggiunta al diario di oggi.");
    setTimeout(() => setBeerMsg(null), 2500);
  };

  const manualValid = manualEntry.name.trim() !== "" && manualEntry.kcal !== "" && !Number.isNaN(Number(manualEntry.kcal));

  const handleAddManual = () => {
    if (!manualValid) return;
    const total = { kcal: Number(manualEntry.kcal) || 0, protein: Number(manualEntry.protein) || 0, carbs: Number(manualEntry.carbs) || 0, fat: Number(manualEntry.fat) || 0 };
    const entry = { id: "manual-" + Date.now(), date: todayISO(), time: new Date().toISOString().slice(11, 16), source: "manuale", items: [{ name: manualEntry.name.trim(), grams: null, ...total }], total, note: "Inserito manualmente." };
    persist({ ...appData, journal: [entry, ...appData.journal] });
    setManualEntry(emptyManualEntry()); setManualOpen(false);
    setManualMsg(`"${entry.items[0].name}" aggiunto al diario di oggi.`);
    setTimeout(() => setManualMsg(null), 2500);
  };

  return (
    <div style={{ maxWidth: 720, margin: "0 auto" }}>
      <div style={{ background: `linear-gradient(135deg, ${COLORS.surface}, ${COLORS.surface2})`, border: `1px solid ${COLORS.border}`, borderRadius: 18, padding: 22, marginBottom: 20 }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: COLORS.green, marginBottom: 6 }}>ANALISI CIBO · VISION</div>
        <h1 style={{ fontFamily: "Space Grotesk", fontSize: 24, color: COLORS.text, margin: "0 0 6px" }}>Cosa hai nel piatto?</h1>
        <p style={{ fontSize: 13, color: COLORS.muted, margin: 0 }}>Scatta o carica una foto del pasto: Claude stima porzioni, calorie e macronutrienti. Puoi anche registrare una birra o inserire le calorie a mano qui sotto.</p>
      </div>

      <SectionCard number="↻" title={`Oggi (${todayEntries.length} voce/i)`} icon="🍽️" accent={COLORS.blue}>
        {todayEntries.length > 0 ? (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(100px, 1fr))", gap: 10 }}>
            <StatChip icon="🔥" label="Calorie" value={todayTotals.kcal + " kcal"} color={COLORS.amber} />
            <StatChip icon="🥩" label="Proteine" value={todayTotals.protein + " g"} />
            <StatChip icon="🍞" label="Carboidrati" value={todayTotals.carbs + " g"} />
            <StatChip icon="🧈" label="Grassi" value={todayTotals.fat + " g"} />
          </div>
        ) : <p style={{ fontSize: 12, color: COLORS.muted, margin: 0 }}>Ancora nessuna voce oggi.</p>}

        <div style={{ marginTop: 14, paddingTop: 14, borderTop: `1px solid ${COLORS.border}` }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: COLORS.muted, marginBottom: 8 }}>🍺 AGGIUNGI BIRRA</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {BEER_PRESETS.map((p) => <Button key={p.label} variant="secondary" small onClick={() => handleAddBeer(p)}>🍺 {p.label} · {p.kcal} kcal</Button>)}
          </div>
          {beerMsg && <div style={{ marginTop: 8, fontSize: 11.5, color: COLORS.green }}>✅ {beerMsg}</div>}
        </div>

        <div style={{ marginTop: 14, paddingTop: 14, borderTop: `1px solid ${COLORS.border}` }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: manualOpen ? 10 : 0 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: COLORS.muted }}>✏️ INSERISCI CALORIE MANUALMENTE</div>
            <Button variant="ghost" small onClick={() => setManualOpen((v) => !v)}>{manualOpen ? "✕ Chiudi" : "➕ Aggiungi"}</Button>
          </div>
          {manualOpen && (
            <div style={{ background: COLORS.surface2, border: `1px solid ${COLORS.border}`, borderRadius: 12, padding: 14 }}>
              <div style={{ marginBottom: 10 }}>
                <label style={{ fontSize: 10.5, color: COLORS.muted, display: "block", marginBottom: 5 }}>Nome del pasto / alimento</label>
                <input value={manualEntry.name} onChange={(e) => setManualEntry((v) => ({ ...v, name: e.target.value }))} placeholder="Es. Barretta proteica…"
                  style={{ width: "100%", boxSizing: "border-box", background: COLORS.bg, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "9px 10px", color: COLORS.text, fontSize: 13 }} />
              </div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
                <FieldInput label="Calorie *" type="number" suffix="kcal" value={manualEntry.kcal} onChange={(e) => setManualEntry((v) => ({ ...v, kcal: e.target.value }))} placeholder="0" />
                <FieldInput label="Proteine" type="number" suffix="g" value={manualEntry.protein} onChange={(e) => setManualEntry((v) => ({ ...v, protein: e.target.value }))} placeholder="0" />
                <FieldInput label="Carboidrati" type="number" suffix="g" value={manualEntry.carbs} onChange={(e) => setManualEntry((v) => ({ ...v, carbs: e.target.value }))} placeholder="0" />
                <FieldInput label="Grassi" type="number" suffix="g" value={manualEntry.fat} onChange={(e) => setManualEntry((v) => ({ ...v, fat: e.target.value }))} placeholder="0" />
              </div>
              <Button onClick={handleAddManual} disabled={!manualValid}>➕ Aggiungi al diario di oggi</Button>
            </div>
          )}
          {manualMsg && <div style={{ marginTop: 8, fontSize: 11.5, color: COLORS.green }}>✅ {manualMsg}</div>}
        </div>
      </SectionCard>

      <input id="food-photo-input" ref={inputRef} type="file" accept="image/*" onChange={handleFile} style={{ display: "none" }} />
      <input id="food-camera-input" ref={cameraInputRef} type="file" accept="image/*" capture="environment" onChange={handleFile} style={{ display: "none" }} />

      {!preview && (
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <label htmlFor="food-camera-input" style={{ flex: "1 1 220px", border: `1.5px dashed ${COLORS.border}`, borderRadius: 16, padding: "40px 20px", display: "flex", flexDirection: "column", alignItems: "center", gap: 10, cursor: "pointer", color: COLORS.muted, boxSizing: "border-box" }}>
            <span style={{ fontSize: 26 }}>📷</span>
            <span style={{ fontSize: 13, fontWeight: 600, color: COLORS.text }}>Scatta foto</span>
          </label>
          <label htmlFor="food-photo-input" style={{ flex: "1 1 220px", border: `1.5px dashed ${COLORS.border}`, borderRadius: 16, padding: "40px 20px", display: "flex", flexDirection: "column", alignItems: "center", gap: 10, cursor: "pointer", color: COLORS.muted, boxSizing: "border-box" }}>
            <span style={{ fontSize: 26 }}>⬆️</span>
            <span style={{ fontSize: 13, fontWeight: 600, color: COLORS.text }}>Carica da galleria</span>
          </label>
        </div>
      )}

      {preview && (
        <div style={{ marginBottom: 16 }}>
          <div style={{ position: "relative", borderRadius: 16, overflow: "hidden", border: `1px solid ${COLORS.border}` }}>
            <img src={preview} alt="Pasto" style={{ width: "100%", maxHeight: 320, objectFit: "cover", display: "block" }} />
            {loading && <div style={{ position: "absolute", inset: 0, background: "#10161Acc", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 8 }}><Spinner /><span style={{ fontSize: 12, color: COLORS.text }}>Analisi in corso…</span></div>}
          </div>
          <div style={{ marginTop: 10 }}><Button variant="secondary" small onClick={() => { setPreview(null); setResult(null); setError(null); setSaved(false); }}>🔄 Nuova foto</Button></div>
        </div>
      )}

      {error && <div style={{ background: "#3A1A1A", border: `1px solid ${COLORS.coral}55`, borderRadius: 12, padding: 12, marginBottom: 16, color: "#F0A99A", fontSize: 12 }}>⚠️ {error}</div>}

      {result && (
        <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 16, padding: 18 }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5 }}>
            <thead><tr style={{ color: COLORS.muted, textAlign: "left" }}><th style={{ padding: "6px 4px" }}>Alimento</th><th style={{ padding: "6px 4px", textAlign: "right" }}>g</th><th style={{ padding: "6px 4px", textAlign: "right" }}>kcal</th><th style={{ padding: "6px 4px", textAlign: "right" }}>P</th><th style={{ padding: "6px 4px", textAlign: "right" }}>C</th><th style={{ padding: "6px 4px", textAlign: "right" }}>G</th></tr></thead>
            <tbody style={{ fontFamily: "JetBrains Mono", color: COLORS.text }}>
              {(result.items || []).map((it, i) => (
                <tr key={i} style={{ borderTop: `1px solid ${COLORS.border}` }}>
                  <td style={{ padding: "7px 4px", fontFamily: "Inter" }}>{it.name}</td>
                  <td style={{ padding: "7px 4px", textAlign: "right" }}>{it.grams}</td>
                  <td style={{ padding: "7px 4px", textAlign: "right" }}>{it.kcal}</td>
                  <td style={{ padding: "7px 4px", textAlign: "right" }}>{it.protein}</td>
                  <td style={{ padding: "7px 4px", textAlign: "right" }}>{it.carbs}</td>
                  <td style={{ padding: "7px 4px", textAlign: "right" }}>{it.fat}</td>
                </tr>
              ))}
              <tr style={{ borderTop: `2px solid ${COLORS.border}`, fontWeight: 700 }}>
                <td style={{ padding: "8px 4px", fontFamily: "Inter", color: COLORS.green }}>TOTALE</td>
                <td style={{ padding: "8px 4px", textAlign: "right" }}>–</td>
                <td style={{ padding: "8px 4px", textAlign: "right", color: COLORS.amber }}>{result.total?.kcal}</td>
                <td style={{ padding: "8px 4px", textAlign: "right" }}>{result.total?.protein}</td>
                <td style={{ padding: "8px 4px", textAlign: "right" }}>{result.total?.carbs}</td>
                <td style={{ padding: "8px 4px", textAlign: "right" }}>{result.total?.fat}</td>
              </tr>
            </tbody>
          </table>
          {result.note && <p style={{ fontSize: 12, color: COLORS.muted, marginTop: 12, fontStyle: "italic" }}>{result.note}</p>}
          <div style={{ marginTop: 14 }}>
            {saved ? <span style={{ color: COLORS.green, fontSize: 12, fontWeight: 600 }}>✅ Aggiunto al diario di oggi</span> : <Button onClick={handleSaveToJournal}>➕ Aggiungi al diario di oggi</Button>}
          </div>
        </div>
      )}
    </div>
  );
}

// TAB 2 — Coach Settimanale
// ---------------------------------------------------------------------------
function WeeklyCoachTab({ appData, persist }) {
  const [goal, setGoal] = useState(appData.goal || "");
  const [workoutSessions, setWorkoutSessions] = useState("");
  const [workoutNotes, setWorkoutNotes] = useState("");
  const [extractingWorkout, setExtractingWorkout] = useState(false);
  const [workoutMsg, setWorkoutMsg] = useState(null);
  const [healthData, setHealthData] = useState(null);
  const [healthPreview, setHealthPreview] = useState(null);
  const [extractingHealth, setExtractingHealth] = useState(false);
  const [healthError, setHealthError] = useState(null);
  const [analyzing, setAnalyzing] = useState(false);
  const [report, setReport] = useState(null);
  const [reportError, setReportError] = useState(null);
  const [workoutLogged, setWorkoutLogged] = useState(false);
  const healthInputRef = useRef(null);
  const workoutInputRef = useRef(null);

  const lastWeight = appData.weights[0]?.weight ?? null;
  const prevWeight = appData.weights.find((w) => w.date < (appData.weights[0]?.date || todayISO()))?.weight ?? null;
  const currentWeight = healthData?.weight ?? lastWeight;
  const nutriAvg = getEffectiveNutritionAvg(appData);
  const recentWorkouts = appData.workouts.slice(0, 4);

  const handleHealthUpload = async (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    setHealthError(null); setExtractingHealth(true);
    try {
      const b64 = await fileToBase64(file); setHealthPreview(b64.preview);
      const text = await callClaude({ system: SYS_HEALTH_EXTRACT, content: [{ type: "image", source: { type: "base64", media_type: b64.mimeType, data: b64.data } }, { type: "text", text: "Estrai tutti i dati da questo screenshot." }] });
      const parsed = parseJsonLoose(text);
      if (!parsed) throw new Error("Non sono riuscito a leggere lo screenshot.");
      setHealthData(parsed);
      if (parsed.weight) persist({ ...appData, weights: [{ date: todayISO(), weight: parsed.weight, source: "health-screenshot" }, ...appData.weights.filter((w) => w.date !== todayISO())] });
    } catch (err) { setHealthError(err.message || "Errore nell'estrazione dello screenshot."); }
    finally { setExtractingHealth(false); if (healthInputRef.current) healthInputRef.current.value = ""; }
  };

  const handleWorkoutUpload = async (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    setExtractingWorkout(true); setWorkoutMsg(null);
    try {
      const b64 = await fileToBase64(file);
      const text = await callClaude({ system: SYS_WORKOUT_EXTRACT, content: [{ type: "image", source: { type: "base64", media_type: b64.mimeType, data: b64.data } }, { type: "text", text: "Estrai i dettagli dell'allenamento da questa immagine." }] });
      const parsed = parseJsonLoose(text);
      if (!parsed) throw new Error("Non sono riuscito a leggere lo screenshot dell'allenamento.");
      if (parsed.sessions) setWorkoutSessions(parsed.sessions);
      if (parsed.notes) setWorkoutNotes((prev) => (prev ? prev + "\n" + parsed.notes : parsed.notes));
      setWorkoutMsg(parsed.summary || "Dati estratti e aggiunti alle note.");
    } catch (err) { setWorkoutMsg("Errore: " + (err.message || "estrazione non riuscita.")); }
    finally { setExtractingWorkout(false); if (workoutInputRef.current) workoutInputRef.current.value = ""; }
  };

  const persistWorkoutToHistory = (baseData) => {
    if (!workoutSessions && !workoutNotes) return baseData;
    const today = todayISO();
    const entry = { id: "workout-" + Date.now(), date: today, sessions: workoutSessions, notes: workoutNotes };
    return { ...baseData, workouts: [entry, ...baseData.workouts.filter((w) => w.date !== today)] };
  };

  const handleAnalyze = async () => {
    setAnalyzing(true); setReportError(null); setReport(null);
    const withWorkout = persistWorkoutToHistory({ ...appData, goal });
    persist(withWorkout); setWorkoutLogged(true);

    const historyText = recentWorkouts.length > 0 ? recentWorkouts.map((w) => `- ${w.date}: ${w.sessions || "sessioni non specificate"} — ${w.notes || "nessuna nota"}`).join("\n") : "Nessuno storico allenamenti precedente disponibile.";

    const promptText = `PROFILO E OBIETTIVO
Obiettivo attuale: ${goal || "non specificato"}
Peso attuale: ${currentWeight ?? "non disponibile"} kg
Peso settimana scorsa: ${prevWeight ?? "non disponibile"} kg

ALIMENTAZIONE (media giornaliera${nutriAvg?.archived ? ", da media settimanale archiviata" : ", calcolata dal diario"}, ${nutriAvg?.days ?? 0} giorno/i)
Calorie medie: ${nutriAvg?.kcal ?? "n/d"} kcal
Proteine medie: ${nutriAvg?.protein ?? "n/d"} g
Carboidrati medi: ${nutriAvg?.carbs ?? "n/d"} g
Grassi medi: ${nutriAvg?.fat ?? "n/d"} g

ALLENAMENTO DI QUESTA SETTIMANA
Sessioni: ${workoutSessions || "non specificate"}
Dettagli/note: ${workoutNotes || "nessuna nota"}

STORICO ALLENAMENTI (settimane precedenti, più recente prima)
${historyText}

DATI GOOGLE HEALTH (da screenshot)
Passi: ${healthData?.steps ?? "n/d"}
Sonno: ${healthData?.sleepHours ?? "n/d"} h
Calorie bruciate: ${healthData?.caloriesBurned ?? "n/d"}
Frequenza cardiaca a riposo: ${healthData?.restingHeartRate ?? "n/d"} bpm
HRV: ${healthData?.hrv ?? "n/d"}
SpO2: ${healthData?.spo2 ?? "n/d"}
Frequenza respiratoria: ${healthData?.respiratoryRate ?? "n/d"}
Distanza: ${healthData?.distanceKm ?? "n/d"} km
Minuti attivi: ${healthData?.activeMinutes ?? "n/d"}

Analizza questi dati, confrontando l'allenamento di questa settimana con lo storico, e genera il piano per la settimana prossima.`;

    try {
      const text = await callClaude({ system: SYS_WEEKLY_COACH, content: [{ type: "text", text: promptText }], maxTokens: 1400 });
      const parsed = parseJsonLoose(text);
      if (!parsed) throw new Error("Non sono riuscito a interpretare il report del coach.");
      setReport(parsed);
    } catch (err) { setReportError(err.message || "Errore nella generazione del report."); }
    finally { setAnalyzing(false); }
  };

  const weightDelta = currentWeight != null && prevWeight != null ? +(currentWeight - prevWeight).toFixed(1) : null;

  return (
    <div style={{ maxWidth: 760, margin: "0 auto" }}>
      <div style={{ background: `linear-gradient(135deg, ${COLORS.surface}, ${COLORS.surface2})`, border: `1px solid ${COLORS.border}`, borderRadius: 18, padding: 22, marginBottom: 20 }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: COLORS.blue, marginBottom: 6 }}>COACH SETTIMANALE</div>
        <h1 style={{ fontFamily: "Space Grotesk", fontSize: 24, color: COLORS.text, margin: "0 0 6px" }}>Check-up di fine settimana</h1>
        <p style={{ fontSize: 13, color: COLORS.muted, margin: 0 }}>Peso e dati Google Health arrivano dallo screenshot, l'alimentazione dalla media del diario: tu inserisci solo obiettivo e allenamento.</p>
      </div>

      <SectionCard number="1" title="Profilo e Obiettivo" icon="🎯" accent={COLORS.green}>
        <label style={{ fontSize: 12, color: COLORS.muted, display: "block", marginBottom: 6 }}>Obiettivo attuale</label>
        <input value={goal} onChange={(e) => setGoal(e.target.value)} placeholder="Es. Definizione muscolare, Massa pulita, Mantenimento"
          style={{ width: "100%", boxSizing: "border-box", background: COLORS.bg, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "10px 12px", color: COLORS.text, fontSize: 13, marginBottom: 14 }} />
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <div style={{ flex: "1 1 160px", background: COLORS.surface2, border: `1px solid ${COLORS.border}`, borderRadius: 12, padding: 14 }}>
            <div style={{ fontSize: 10, color: COLORS.muted }}>PESO ATTUALE (auto)</div>
            <div style={{ fontFamily: "JetBrains Mono", fontSize: 22, fontWeight: 600, color: COLORS.text }}>{currentWeight != null ? `${currentWeight} kg` : "—"}</div>
            <div style={{ fontSize: 10, color: COLORS.muted }}>dallo screenshot Google Health (sez. 4)</div>
          </div>
          <div style={{ flex: "1 1 160px", background: COLORS.surface2, border: `1px solid ${COLORS.border}`, borderRadius: 12, padding: 14 }}>
            <div style={{ fontSize: 10, color: COLORS.muted }}>SETTIMANA SCORSA (storico)</div>
            <div style={{ fontFamily: "JetBrains Mono", fontSize: 22, fontWeight: 600, color: COLORS.text }}>{prevWeight != null ? `${prevWeight} kg` : "—"}</div>
            <div style={{ fontSize: 10, color: weightDelta > 0 ? COLORS.coral : weightDelta < 0 ? COLORS.green : COLORS.muted }}>{weightDelta != null ? `${weightDelta > 0 ? "+" : ""}${weightDelta} kg` : "variazione non disponibile"}</div>
          </div>
        </div>
      </SectionCard>

      <SectionCard number="2" title="Alimentazione (media giornaliera)" icon="🔥" accent={COLORS.amber}>
        {nutriAvg ? (
          <>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(110px, 1fr))", gap: 10 }}>
              <StatChip icon="🔥" label="Calorie" value={nutriAvg.kcal + " kcal"} color={COLORS.amber} />
              <StatChip icon="🥩" label="Proteine" value={nutriAvg.protein + " g"} />
              <StatChip icon="🍞" label="Carboidrati" value={nutriAvg.carbs + " g"} />
              <StatChip icon="🧈" label="Grassi" value={nutriAvg.fat + " g"} />
            </div>
            <p style={{ fontSize: 11, color: COLORS.muted, marginTop: 10, marginBottom: 0 }}>{nutriAvg.archived ? `Media archiviata dal diario.` : `Calcolata su ${nutriAvg.days} giorno/i registrato/i negli ultimi 7 giorni.`}</p>
          </>
        ) : <p style={{ fontSize: 12, color: COLORS.muted, margin: 0 }}>Nessun pasto registrato negli ultimi 7 giorni.</p>}
      </SectionCard>

      <SectionCard number="3" title="Allenamento & Attività" icon="🏋️" accent={COLORS.blue}>
        <div style={{ display: "flex", gap: 8, alignItems: "flex-end", marginBottom: 10, flexWrap: "wrap" }}>
          <div style={{ flex: "1 1 200px" }}>
            <label style={{ fontSize: 12, color: COLORS.muted, display: "block", marginBottom: 6 }}>Sessioni svolte</label>
            <input value={workoutSessions} onChange={(e) => setWorkoutSessions(e.target.value)} placeholder="Es. 2 giorni pesi + 2 EMS training"
              style={{ width: "100%", boxSizing: "border-box", background: COLORS.bg, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "10px 12px", color: COLORS.text, fontSize: 13 }} />
          </div>
          <input id="workout-photo-input" ref={workoutInputRef} type="file" accept="image/*" onChange={handleWorkoutUpload} style={{ display: "none" }} />
          <label htmlFor="workout-photo-input" style={{ display: "inline-flex", alignItems: "center", gap: 7, fontWeight: 600, fontSize: 12, padding: "7px 12px", borderRadius: 12, cursor: extractingWorkout ? "not-allowed" : "pointer", opacity: extractingWorkout ? 0.55 : 1, background: COLORS.surface2, color: COLORS.text, border: `1px solid ${COLORS.border}` }}>
            {extractingWorkout ? <Spinner size={13} /> : "📷"} {extractingWorkout ? "Lettura…" : "Carica foto scheda"}
          </label>
        </div>
        {workoutMsg && <div style={{ fontSize: 11.5, color: COLORS.green, marginBottom: 10 }}>✅ {workoutMsg}</div>}
        <label style={{ fontSize: 12, color: COLORS.muted, display: "block", marginBottom: 6 }}>Dettagli allenamento</label>
        <textarea rows={4} value={workoutNotes} onChange={(e) => setWorkoutNotes(e.target.value)} placeholder="Es. Panca piana 4x8 @ 80kg, Squat 3x10 @ 100kg…"
          style={{ width: "100%", boxSizing: "border-box", background: COLORS.bg, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "10px 12px", color: COLORS.text, fontSize: 13, resize: "vertical" }} />
        {recentWorkouts.length > 0 && (
          <div style={{ marginTop: 16, paddingTop: 14, borderTop: `1px solid ${COLORS.border}` }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: COLORS.muted, marginBottom: 8 }}>STORICO RECENTE</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {recentWorkouts.map((w) => (
                <div key={w.id} style={{ background: COLORS.surface2, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "8px 12px" }}>
                  <div style={{ fontSize: 11.5, color: COLORS.text, fontWeight: 600 }}>{w.date} — {w.sessions || "sessioni non specificate"}</div>
                  {w.notes && <div style={{ fontSize: 11, color: COLORS.muted, marginTop: 3 }}>{w.notes}</div>}
                </div>
              ))}
            </div>
          </div>
        )}
      </SectionCard>

      <SectionCard number="4" title="Dati Google Health (screenshot)" icon="❤️" accent={COLORS.coral}>
        <input id="health-screenshot-input" ref={healthInputRef} type="file" accept="image/*" onChange={handleHealthUpload} style={{ display: "none" }} />
        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginBottom: 12 }}>
          <label htmlFor="health-screenshot-input" style={{ display: "inline-flex", alignItems: "center", gap: 7, fontWeight: 600, fontSize: 13, padding: "11px 18px", borderRadius: 12, cursor: extractingHealth ? "not-allowed" : "pointer", opacity: extractingHealth ? 0.55 : 1, background: COLORS.green, color: "#10160F" }}>
            {extractingHealth ? <Spinner size={14} color="#10160F" /> : "⬆️"} {extractingHealth ? "Lettura screenshot…" : "Carica screenshot"}
          </label>
          {healthPreview && <img src={healthPreview} alt="Screenshot" style={{ height: 44, borderRadius: 8, border: `1px solid ${COLORS.border}` }} />}
        </div>
        {healthError && <div style={{ fontSize: 11.5, color: "#F0A99A", marginBottom: 10 }}>⚠️ {healthError}</div>}
        {healthData && (
          <>
            {healthData.summary && <p style={{ fontSize: 12, color: COLORS.muted, margin: "0 0 10px", fontStyle: "italic" }}>{healthData.summary}</p>}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(120px, 1fr))", gap: 10 }}>
              <StatChip icon="⚖️" label="Peso" value={healthData.weight ? healthData.weight + " kg" : null} color={COLORS.green} />
              <StatChip icon="👣" label="Passi" value={healthData.steps} color={COLORS.green} />
              <StatChip icon="🌙" label="Sonno" value={healthData.sleepHours ? healthData.sleepHours + " h" : null} color={COLORS.blue} />
              <StatChip icon="🔥" label="Cal. bruciate" value={healthData.caloriesBurned} color={COLORS.amber} />
              <StatChip icon="❤️" label="FC riposo" value={healthData.restingHeartRate ? healthData.restingHeartRate + " bpm" : null} color={COLORS.coral} />
              <StatChip icon="📈" label="HRV" value={healthData.hrv} />
              <StatChip icon="💨" label="SpO2" value={healthData.spo2 ? healthData.spo2 + "%" : null} />
              <StatChip icon="💨" label="Freq. resp." value={healthData.respiratoryRate} />
              <StatChip icon="↗️" label="Distanza" value={healthData.distanceKm ? healthData.distanceKm + " km" : null} />
              <StatChip icon="📈" label="Min. attivi" value={healthData.activeMinutes} />
            </div>
          </>
        )}
        {!healthData && !extractingHealth && <p style={{ fontSize: 12, color: COLORS.muted, margin: 0 }}>Carica lo screenshot dello stato di salute.</p>}
      </SectionCard>

      <Button variant="amber" onClick={handleAnalyze} disabled={analyzing} style={{ width: "100%", padding: "14px 18px", fontSize: 14 }}>
        {analyzing ? <Spinner size={16} color="#1A1206" /> : "✨"} {analyzing ? "Il coach sta analizzando i dati…" : "Analizza e Genera Piano Settimanale"}
      </Button>

      {workoutLogged && <div style={{ marginTop: 10, fontSize: 11.5, color: COLORS.green }}>✅ Allenamento salvato nello storico.</div>}
      {reportError && <div style={{ background: "#3A1A1A", border: `1px solid ${COLORS.coral}55`, borderRadius: 12, padding: 12, marginTop: 16, color: "#F0A99A", fontSize: 12 }}>⚠️ {reportError}</div>}

      {report && (
        <div style={{ marginTop: 20, background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 16, padding: 20 }}>
          <h3 style={{ fontFamily: "Space Grotesk", fontSize: 16, color: COLORS.text, margin: "0 0 16px" }}>Report del Coach</h3>
          {[
            { label: "Valutazione della settimana", value: report.valutazione, color: COLORS.blue },
            { label: "Aggiustamenti nutrizionali", value: report.aggiustamenti_nutrizionali, color: COLORS.amber },
            { label: "Aggiustamenti allenamento", value: report.aggiustamenti_allenamento, color: COLORS.coral },
            { label: "Focus della settimana", value: report.focus_settimana, color: COLORS.green },
          ].map((s, i) => (
            <div key={i} style={{ marginBottom: 14, paddingLeft: 12, borderLeft: `3px solid ${s.color}` }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: s.color, marginBottom: 4 }}>{s.label.toUpperCase()}</div>
              <div style={{ fontSize: 13, color: COLORS.text, lineHeight: 1.5 }}>{s.value}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------------
// TAB 3 — Diario
// ---------------------------------------------------------------------------
function JournalTab({ appData, persist }) {
  const weightSeries = [...appData.weights].sort((a, b) => a.date.localeCompare(b.date)).map((w) => ({ date: w.date.slice(5), peso: w.weight }));
  const [archiveMsg, setArchiveMsg] = useState(null);

  const handleDeleteEntry = (id) => persist({ ...appData, journal: appData.journal.filter((e) => e.id !== id) });
  const handleDeleteWorkout = (id) => persist({ ...appData, workouts: appData.workouts.filter((w) => w.id !== id) });

  const handleArchiveWeek = () => {
    const avg = computeWeeklyNutritionAvg(appData.journal);
    if (!avg) { setArchiveMsg("Nessuna voce negli ultimi 7 giorni da archiviare."); setTimeout(() => setArchiveMsg(null), 3000); return; }
    const cutoff = daysAgoISO(7);
    const archived = { id: "avg-" + Date.now(), date: todayISO(), ...avg };
    persist({ ...appData, journal: appData.journal.filter((e) => e.date < cutoff), nutritionWeeklyAverages: [archived, ...appData.nutritionWeeklyAverages] });
    setArchiveMsg("Media settimanale salvata, pasti dettagliati eliminati.");
    setTimeout(() => setArchiveMsg(null), 3000);
  };

  return (
    <div style={{ maxWidth: 760, margin: "0 auto" }}>
      <div style={{ background: `linear-gradient(135deg, ${COLORS.surface}, ${COLORS.surface2})`, border: `1px solid ${COLORS.border}`, borderRadius: 18, padding: 22, marginBottom: 20 }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: COLORS.amber, marginBottom: 6 }}>DIARIO & STORICO</div>
        <h1 style={{ fontFamily: "Space Grotesk", fontSize: 24, color: COLORS.text, margin: 0 }}>I tuoi progressi</h1>
      </div>

      <SectionCard number="↗" title="Andamento peso" icon="📈" accent={COLORS.green}>
        {weightSeries.length > 1 ? <MiniLineChart points={weightSeries} /> : <p style={{ fontSize: 12, color: COLORS.muted, margin: 0 }}>Servono almeno due rilevazioni di peso per mostrare il grafico.</p>}
      </SectionCard>

      <SectionCard number="🍽" title={`Pasti registrati (${appData.journal.length})`} icon="🍽️" accent={COLORS.amber}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 12 }}>
          <p style={{ fontSize: 11.5, color: COLORS.muted, margin: 0 }}>Elimina singole voci o archivia la settimana.</p>
          <Button variant="ghost" small onClick={handleArchiveWeek}>🗄️ Archivia settimana</Button>
        </div>
        {archiveMsg && <div style={{ fontSize: 11.5, color: COLORS.green, marginBottom: 10 }}>✅ {archiveMsg}</div>}
        {appData.journal.length === 0 ? <p style={{ fontSize: 12, color: COLORS.muted, margin: 0 }}>Ancora nessun pasto nel diario.</p> : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 320, overflowY: "auto" }}>
            {appData.journal.slice(0, 40).map((e) => (
              <div key={e.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: COLORS.surface2, borderRadius: 10, padding: "8px 12px", border: `1px solid ${COLORS.border}`, gap: 10 }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 12.5, color: COLORS.text, fontWeight: 600 }}>{e.source === "birra" ? "🍺 " : e.source === "manuale" ? "✏️ " : ""}{(e.items || []).map((i) => i.name).join(", ") || "Pasto"}</div>
                  <div style={{ fontSize: 10.5, color: COLORS.muted }}>{e.date} · {e.time}</div>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0 }}>
                  <div style={{ fontFamily: "JetBrains Mono", fontSize: 13, color: COLORS.amber, fontWeight: 600 }}>{e.total?.kcal} kcal</div>
                  <button onClick={() => handleDeleteEntry(e.id)} style={{ background: "transparent", border: "none", cursor: "pointer", color: COLORS.muted, padding: 4 }}>🗑️</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </SectionCard>

      <SectionCard number="Σ" title={`Medie settimanali archiviate (${appData.nutritionWeeklyAverages.length})`} icon="🗄️" accent={COLORS.purple}>
        {appData.nutritionWeeklyAverages.length === 0 ? <p style={{ fontSize: 12, color: COLORS.muted, margin: 0 }}>Nessuna media archiviata finora.</p> : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 240, overflowY: "auto" }}>
            {appData.nutritionWeeklyAverages.map((a) => (
              <div key={a.id} style={{ background: COLORS.surface2, borderRadius: 10, padding: "8px 12px", border: `1px solid ${COLORS.border}` }}>
                <div style={{ fontSize: 11.5, color: COLORS.text, fontWeight: 600 }}>{a.date} · media su {a.days} giorno/i</div>
                <div style={{ fontFamily: "JetBrains Mono", fontSize: 11.5, color: COLORS.muted, marginTop: 3 }}>{a.kcal} kcal · {a.protein}P · {a.carbs}C · {a.fat}G</div>
              </div>
            ))}
          </div>
        )}
      </SectionCard>

      <SectionCard number="🏋" title={`Storico allenamenti (${appData.workouts.length})`} icon="🏋️" accent={COLORS.blue}>
        {appData.workouts.length === 0 ? <p style={{ fontSize: 12, color: COLORS.muted, margin: 0 }}>Nessun allenamento salvato ancora.</p> : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 320, overflowY: "auto" }}>
            {appData.workouts.map((w) => (
              <div key={w.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, background: COLORS.surface2, borderRadius: 10, padding: "8px 12px", border: `1px solid ${COLORS.border}` }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 12.5, color: COLORS.text, fontWeight: 600 }}>{w.date} — {w.sessions || "sessioni non specificate"}</div>
                  {w.notes && <div style={{ fontSize: 11, color: COLORS.muted, marginTop: 3, whiteSpace: "pre-wrap" }}>{w.notes}</div>}
                </div>
                <button onClick={() => handleDeleteWorkout(w.id)} style={{ background: "transparent", border: "none", cursor: "pointer", color: COLORS.muted, padding: 4, flexShrink: 0 }}>🗑️</button>
              </div>
            ))}
          </div>
        )}
      </SectionCard>
    </div>
  );
}

// ---------------------------------------------------------------------------
// App shell
// ---------------------------------------------------------------------------
function App() {
  const [tab, setTab] = useState("vision");
  const [appData, setAppData] = useState(emptyData());

  useEffect(() => { setAppData(loadAppData()); }, []);

  const persist = useCallback((next) => { setAppData(next); saveAppData(next); }, []);

  const tabs = [
    { id: "vision", label: "Analisi Cibo", icon: "📷" },
    { id: "coach", label: "Coach Settimanale", icon: "🏋️" },
    { id: "journal", label: "Diario", icon: "📖" },
  ];

  return (
    <div style={{ minHeight: "100%", background: COLORS.bg, paddingBottom: 60 }}>
      <div style={{ position: "sticky", top: 0, zIndex: 10, background: COLORS.bg + "F2", backdropFilter: "blur(8px)", borderBottom: `1px solid ${COLORS.border}`, padding: "14px 16px" }}>
        <div style={{ maxWidth: 760, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <div style={{ width: 28, height: 28, borderRadius: 8, background: COLORS.green, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15 }}>✨</div>
            <span style={{ fontFamily: "Space Grotesk", fontWeight: 700, fontSize: 15, color: COLORS.text }}>NutriVision & Fitness Coach</span>
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            {tabs.map((t) => {
              const active = tab === t.id;
              return (
                <button key={t.id} onClick={() => setTab(t.id)} style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 12px", borderRadius: 10, border: `1px solid ${active ? COLORS.green : COLORS.border}`, background: active ? COLORS.green + "1A" : "transparent", color: active ? COLORS.green : COLORS.muted, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>
                  {t.icon} {t.label}
                </button>
              );
            })}
          </div>
        </div>
      </div>
      <div style={{ padding: "28px 16px" }}>
        {tab === "vision" ? <FoodVisionTab appData={appData} persist={persist} /> : tab === "coach" ? <WeeklyCoachTab appData={appData} persist={persist} /> : <JournalTab appData={appData} persist={persist} />}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
