<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NutriVision & Fitness Coach</title>

<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#10161A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NutriVision" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="icon" href="/icon-192.png" />

<!-- React, ReactDOM e il codice dell'app sono già inclusi in /app.bundle.js: nessuno script esterno da internet. -->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; background: #10161A; }
  body { font-family: 'Inter', sans-serif; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #28333A; border-radius: 4px; }
  .spin { animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #8FBF6B; outline-offset: 1px; }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<div id="root">
  <div id="nv-boot-status" style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; box-sizing:border-box; font-family: 'Inter', sans-serif; color:#EDEFEF; text-align:center;">
    <div style="width:26px; height:26px; border:2.5px solid #8FBF6B55; border-top-color:#8FBF6B; border-radius:50%; animation: spin 1s linear infinite;"></div>
    <div style="font-size:13px; color:#8B9AA1;">Caricamento dell'app…</div>
  </div>
</div>

<script>
  // Diagnostica di avvio: se /app.bundle.js non si carica o dà errore,
  // mostra un messaggio leggibile invece di lasciare lo schermo vuoto.
  window.__nvErrors = [];
  window.addEventListener("error", function (e) {
    var msg = e && e.message ? e.message : (e && e.target && e.target.src ? "Impossibile caricare: " + e.target.src : "Errore sconosciuto");
    window.__nvErrors.push(msg);
  }, true);

  window.addEventListener("load", function () {
    setTimeout(function () {
      var stillBooting = document.getElementById("nv-boot-status");
      if (!stillBooting) return; // l'app React ha già preso il controllo, tutto ok
      var details = "";
      if (window.__nvErrors.length) {
        details += "<div style='text-align:left; max-width:520px; background:#182126; border:1px solid #28333A; border-radius:10px; padding:12px; font-family: monospace; font-size:11px; color:#E2725B; white-space:pre-wrap;'>" + window.__nvErrors.slice(0, 6).join("\n\n") + "</div>";
      }
      stillBooting.innerHTML =
        "<div style='font-size:15px; font-weight:600; color:#E2725B; margin-bottom:8px;'>⚠️ L'app non si è avviata</div>" +
        "<div style='font-size:12.5px; color:#8B9AA1; max-width:480px; margin-bottom:10px;'>Il file /app.bundle.js non si è caricato correttamente. Verifica che sia stato caricato su GitHub insieme agli altri file.</div>" +
        details +
        "<button onclick='location.reload()' style='margin-top:14px; background:#8FBF6B; color:#10160F; border:none; border-radius:10px; padding:10px 18px; font-weight:600; font-family:Inter,sans-serif; font-size:13px;'>Riprova</button>";
    }, 3000);
  });
</script>

<script src="/app.bundle.js?v=2026081902"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/service-worker.js").catch(() => {});
    });
  }
</script>

<!-- Backup / Ripristino dati: indipendente dall'app React, legge/scrive
     direttamente la chiave "nv-app-data" nel localStorage del telefono. -->
<script>
(function () {
  var STORE_KEY = "nv-app-data";

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function makeButton(label, right) {
    var b = document.createElement("button");
    b.textContent = label;
    b.style.cssText =
      "position:fixed; top:8px; right:" + right + "px; z-index:99999;" +
      "background:#182126; color:#EDEFEF; border:1px solid #28333A;" +
      "border-radius:9px; padding:6px 9px; font-family:Inter,sans-serif;" +
      "font-size:15px; line-height:1; box-shadow:0 2px 8px rgba(0,0,0,.4);" +
      "opacity:0.95;";
    return b;
  }

  function showToast(msg, isError) {
    var t = document.createElement("div");
    t.textContent = msg;
    t.style.cssText =
      "position:fixed; left:50%; bottom:90px; transform:translateX(-50%);" +
      "z-index:100000; background:" + (isError ? "#E2725B" : "#8FBF6B") + ";" +
      "color:#10160F; padding:10px 16px; border-radius:10px; font-family:Inter,sans-serif;" +
      "font-size:13px; font-weight:600; max-width:80vw; text-align:center;";
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3200);
  }

  function exportBackup() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (!raw) { showToast("Nessun dato da esportare ancora.", true); return; }
      var now = new Date();
      var fname = "nutrivision-backup-" + now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + ".json";
      var blob = new Blob([raw], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = fname;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      showToast("Backup scaricato: " + fname);
    } catch (e) {
      showToast("Errore durante il backup: " + e.message, true);
    }
  }

  function importBackup(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result); // valida che sia JSON corretto
        if (typeof parsed !== "object" || parsed === null) throw new Error("Formato non valido");
        window.localStorage.setItem(STORE_KEY, JSON.stringify(parsed));
        showToast("Dati ripristinati. Ricarico l'app…");
        setTimeout(function () { location.reload(); }, 1200);
      } catch (e) {
        showToast("File non valido: " + e.message, true);
      }
    };
    reader.onerror = function () { showToast("Impossibile leggere il file.", true); };
    reader.readAsText(file);
  }

  window.addEventListener("load", function () {
    var exportBtn = makeButton("⬇️", 8);
    exportBtn.title = "Backup";
    exportBtn.addEventListener("click", exportBackup);
    document.body.appendChild(exportBtn);

    var importBtn = makeButton("⬆️", 48);
    importBtn.title = "Ripristina";
    var fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "application/json";
    fileInput.style.display = "none";
    fileInput.addEventListener("change", function () {
      if (fileInput.files && fileInput.files[0]) {
        if (confirm("Questo sovrascriverà i dati attuali dell'app con quelli del backup. Continuare?")) {
          importBackup(fileInput.files[0]);
        }
      }
      fileInput.value = "";
    });
    importBtn.addEventListener("click", function () { fileInput.click(); });
    document.body.appendChild(importBtn);
    document.body.appendChild(fileInput);
  });

  // Navigazione a swipe tra le pagine (Analisi Cibo / Coach Settimanale / Diario).
  // Indipendente dal codice React: trova i pulsanti dei tab dal loro testo e
  // simula il click su quello successivo/precedente in base alla direzione dello swipe.
  (function () {
    var TAB_LABELS = ["Analisi Cibo", "Coach Settimanale", "Diario"];

    function getTabButtons() {
      var allButtons = document.querySelectorAll("button");
      var found = [];
      for (var li = 0; li < TAB_LABELS.length; li++) {
        var match = null;
        for (var i = 0; i < allButtons.length; i++) {
          if (allButtons[i].textContent && allButtons[i].textContent.indexOf(TAB_LABELS[li]) !== -1) {
            match = allButtons[i];
            break;
          }
        }
        if (match) found.push(match);
      }
      return found;
    }

    function activeTabIndex(btns) {
      for (var i = 0; i < btns.length; i++) {
        var bg = window.getComputedStyle(btns[i]).backgroundColor;
        if (bg && bg !== "rgba(0, 0, 0, 0)" && bg !== "transparent") return i;
      }
      return 0;
    }

    var startX = null, startY = null, startTarget = null;

    document.addEventListener("touchstart", function (e) {
      if (e.touches.length !== 1) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      startTarget = e.target;
    }, { passive: true });

    document.addEventListener("touchend", function (e) {
      if (startX === null) return;
      var tag = startTarget && startTarget.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") { startX = null; return; }
      var touch = e.changedTouches && e.changedTouches[0];
      if (!touch) { startX = null; return; }
      var dx = touch.clientX - startX;
      var dy = touch.clientY - startY;
      startX = null;
      if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      var btns = getTabButtons();
      if (btns.length < 2) return;
      var idx = activeTabIndex(btns);
      var nextIdx = dx < 0 ? idx + 1 : idx - 1;
      if (nextIdx < 0) nextIdx = btns.length - 1;
      if (nextIdx >= btns.length) nextIdx = 0;
      btns[nextIdx].click();
    }, { passive: true });
  })();
})();
</script>
</body>
</html>
