<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NutriVision & Fitness Coach</title>

<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#10161A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NutriVision" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="icon" href="/icon-192.png" />

<!-- React, ReactDOM e il codice dell'app sono già inclusi in /app.bundle.js: nessuno script esterno da internet. -->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; background: #10161A; }
  body { font-family: 'Inter', sans-serif; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #28333A; border-radius: 4px; }
  .spin { animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #8FBF6B; outline-offset: 1px; }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<div id="root">
  <div id="nv-boot-status" style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; box-sizing:border-box; font-family: 'Inter', sans-serif; color:#EDEFEF; text-align:center;">
    <div style="width:26px; height:26px; border:2.5px solid #8FBF6B55; border-top-color:#8FBF6B; border-radius:50%; animation: spin 1s linear infinite;"></div>
    <div style="font-size:13px; color:#8B9AA1;">Caricamento dell'app…</div>
  </div>
</div>

<script>
  // Diagnostica di avvio: se /app.bundle.js non si carica o dà errore,
  // mostra un messaggio leggibile invece di lasciare lo schermo vuoto.
  window.__nvErrors = [];
  window.addEventListener("error", function (e) {
    var msg = e && e.message ? e.message : (e && e.target && e.target.src ? "Impossibile caricare: " + e.target.src : "Errore sconosciuto");
    window.__nvErrors.push(msg);
  }, true);

  window.addEventListener("load", function () {
    setTimeout(function () {
      var stillBooting = document.getElementById("nv-boot-status");
      if (!stillBooting) return; // l'app React ha già preso il controllo, tutto ok
      var details = "";
      if (window.__nvErrors.length) {
        details += "<div style='text-align:left; max-width:520px; background:#182126; border:1px solid #28333A; border-radius:10px; padding:12px; font-family: monospace; font-size:11px; color:#E2725B; white-space:pre-wrap;'>" + window.__nvErrors.slice(0, 6).join("\n\n") + "</div>";
      }
      stillBooting.innerHTML =
        "<div style='font-size:15px; font-weight:600; color:#E2725B; margin-bottom:8px;'>⚠️ L'app non si è avviata</div>" +
        "<div style='font-size:12.5px; color:#8B9AA1; max-width:480px; margin-bottom:10px;'>Il file /app.bundle.js non si è caricato correttamente. Verifica che sia stato caricato su GitHub insieme agli altri file.</div>" +
        details +
        "<button onclick='location.reload()' style='margin-top:14px; background:#8FBF6B; color:#10160F; border:none; border-radius:10px; padding:10px 18px; font-weight:600; font-family:Inter,sans-serif; font-size:13px;'>Riprova</button>";
    }, 3000);
  });
</script>

<script src="/app.bundle.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
